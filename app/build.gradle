plugins {
    id 'com.android.application'
}

android {
    namespace 'com.o0ai.control'
    compileSdk 34

    defaultConfig {
        applicationId 'com.o0ai.control'
        minSdk 27
        // Keep Android 8.1 support while targeting a current SDK for release lint.
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
