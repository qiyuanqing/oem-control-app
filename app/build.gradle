plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def hasStableSigning = signingProperties.getProperty('storeFile')
        && signingProperties.getProperty('storePassword')
        && signingProperties.getProperty('keyAlias')
        && signingProperties.getProperty('keyPassword')

android {
    namespace 'com.o0ai.control'
    compileSdk 34

    signingConfigs {
        stable {
            if (hasStableSigning) {
                storeFile file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.o0ai.control'
        minSdk 27
        // Keep Android 8.1 support while targeting a current SDK for release lint.
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
            signingConfig hasStableSigning ? signingConfigs.stable : signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
    }
}
