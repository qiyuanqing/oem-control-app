name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure stable APK signing
        env:
          O0AI_KEYSTORE_BASE64: ${{ secrets.O0AI_KEYSTORE_BASE64 }}
          O0AI_KEYSTORE_PASSWORD: ${{ secrets.O0AI_KEYSTORE_PASSWORD }}
          O0AI_KEY_ALIAS: ${{ secrets.O0AI_KEY_ALIAS }}
          O0AI_KEY_PASSWORD: ${{ secrets.O0AI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$O0AI_KEYSTORE_BASE64" || { echo "Missing O0AI_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$O0AI_KEYSTORE_PASSWORD" || { echo "Missing O0AI_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$O0AI_KEY_ALIAS" || { echo "Missing O0AI_KEY_ALIAS repository secret"; exit 1; }
          test -n "$O0AI_KEY_PASSWORD" || { echo "Missing O0AI_KEY_PASSWORD repository secret"; exit 1; }
          printf '%s' "$O0AI_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/o0ai-control-signing.jks"
          cat > signing.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/o0ai-control-signing.jks
          storePassword=$O0AI_KEYSTORE_PASSWORD
          keyAlias=$O0AI_KEY_ALIAS
          keyPassword=$O0AI_KEY_PASSWORD
          EOF

      - name: Build APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Package system integration payload
        run: |
          mkdir -p dist/system-integration/system/priv-app/O0AIControl
          mkdir -p dist/system-integration/system/etc/init
          mkdir -p dist/system-integration/system/bin
          cp app/build/outputs/apk/debug/app-debug.apk dist/system-integration/system/priv-app/O0AIControl/O0AIControl.apk
          cp system-integration/system/etc/init/o0ai-control.rc dist/system-integration/system/etc/init/o0ai-control.rc
          cp system-integration/system/bin/o0ai-control-provision dist/system-integration/system/bin/o0ai-control-provision
          cp system-integration/README.txt dist/system-integration/README.txt
          chmod 0755 dist/system-integration/system/bin/o0ai-control-provision
          mkdir -p dist
          (cd dist/system-integration && zip -r ../o0ai-control-system-integration-debug.zip .)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: o0ai-control-system-build
          path: |
            app/build/outputs/apk/**/*.apk
            dist/o0ai-control-system-integration-debug.zip
