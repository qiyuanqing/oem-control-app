name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Package system integration payload
        run: |
          mkdir -p dist/system-integration/system/priv-app/O0AIControl
          mkdir -p dist/system-integration/system/etc/init
          mkdir -p dist/system-integration/system/bin
          cp app/build/outputs/apk/debug/app-debug.apk dist/system-integration/system/priv-app/O0AIControl/O0AIControl.apk
          cp system-integration/system/etc/init/o0ai-control.rc dist/system-integration/system/etc/init/o0ai-control.rc
          cp system-integration/system/bin/o0ai-control-provision dist/system-integration/system/bin/o0ai-control-provision
          cp system-integration/README.txt dist/system-integration/README.txt
          chmod 0755 dist/system-integration/system/bin/o0ai-control-provision
          mkdir -p dist
          (cd dist/system-integration && zip -r ../o0ai-control-system-integration-debug.zip .)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: o0ai-control-system-build
          path: |
            app/build/outputs/apk/**/*.apk
            dist/o0ai-control-system-integration-debug.zip
