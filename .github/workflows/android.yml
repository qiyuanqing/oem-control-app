name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Package Magisk module
        run: |
          rm -f magisk-module/system/priv-app/O0AIControl/.placeholder
          cp app/build/outputs/apk/debug/app-debug.apk magisk-module/system/priv-app/O0AIControl/O0AIControl.apk
          chmod 0755 magisk-module/service.sh
          chmod 0755 magisk-module/system/bin/o0ai-control-provision
          mkdir -p dist
          (cd magisk-module && zip -r ../dist/o0ai-control-magisk-auto-owner.zip .)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: o0ai-control-apks
          path: |
            app/build/outputs/apk/**/*.apk
            dist/o0ai-control-magisk-auto-owner.zip
